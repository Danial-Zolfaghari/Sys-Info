name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  collector-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q collector tests
      - name: Collector unit tests
        run: python -m unittest discover -s tests -v

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile collector/sys_info_collector.py

      - run: npm ci
        working-directory: gui

      - shell: pwsh
        run: ./scripts/prepare_build.ps1

      - run: npm run build
        working-directory: gui

      - run: cargo check --manifest-path gui/src-tauri/Cargo.toml

[package]
name = "sysinfo-app"
version = "1.0.0"
description = "SysInfo desktop hardware and system information viewer"
authors = ["Danial Zolfaghari"]
edition = "2021"

[lib]
name = "sysinfo_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
